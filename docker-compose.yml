version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: smart_energy_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    # 👇 Mount your project folder into the container so new files (energy.py etc.)
    # are visible immediately without rebuilding.
    volumes:
      - ./:/app
    # Start Uvicorn (same as you’ve been using)
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: smart_energy_db
    environment:
      POSTGRES_USER: energy_user
      POSTGRES_PASSWORD: energy_password
      POSTGRES_DB: smart_energy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 👇 Healthcheck so 'web' waits until Postgres is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: smart_energy_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
